spring.application.name=asn2

# PostgreSQL connection (Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/staffratings}
spring.datasource.username=${DB_USERNAME:jorgefrancotarasco}
spring.datasource.password=${DB_PASSWORD:}

# Create/update tables from @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL to the terminal (debugging)
spring.jpa.show-sql=true

# Create Spring Session tables in PostgreSQL
spring.session.jdbc.initialize-schema=always

server.port=${PORT:8080}
