<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Page</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h3>Create a new CS Staff Rating</h3>
    </header>
    <main>
        <div class="container-fluid">
            <form th:action="@{/ratings}" th:object="${rating}" method="post">
                <label>Name: <input th:field="*{name}" type="text"></label><br>
                <label>Email: <input th:field="*{email}" type="email"></label><br>
                <label>Role:
                <select th:field="*{roleType}">
                    <option value="">Select a role</option>
                    <option value="TA">Teacher's Assistant (TA)</option>
                    <option value="PROF">Professor</option>
                    <option value="STAFF">Staff member</option>
                    <option value="INSTRUCTOR">Instructor</option>
                </select></label><br>
                <label>Niceness: <input min="1" max="10" th:field="*{niceness}" type="number"></label><br>
                <label>Clarity: <input min="1" max="10" th:field="*{clarity}" type="number"></label><br>
                <label>Knowledgeable: <input min="1" max="10" th:field="*{knowledgeable}" type="number"></label><br>
                <label>Comment <textarea placeholder="Comments on the person" th:field="*{comment}"></textarea></label><br>
                <button type="submit">Save</button>
            </form>
        </div>
    </main>
</body>
</html>
